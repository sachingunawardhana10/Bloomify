<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customize Bouquet — Bloomify</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
  <a href="index.html" class="brand-logo" aria-label="Bloomify home">
    <img src="images/bloomify_logo.png" alt="Bloomify logo">
  </a>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="catalog.html">Flowers</a></li>
      <li><a href="customize.html" class="active">Customize</a></li>
      <li id="nav-admin-link" style="display:none;"><a href="admin.html">Admin</a></li>
      <li id="nav-login-link"><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <div class="nav-right">
    <div class="nav-user" id="nav-user-info">
      <span>
        <i class="fa-solid fa-circle" style="color:#9fe39f;font-size:8px;"></i>
        <span id="nav-user-name"></span>
      </span>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>

    <a href="cart.html" class="nav-cart-btn">
      <i class="fa-solid fa-basket-shopping"></i>
      <span id="cart-count" style="display:none;">0</span>
    </a>
  </div>
</header>

<div class="page-header">
  <h1>Build Your Bouquet</h1>
  <p>Pick flowers, adjust quantities, then add the bouquet to your cart</p>
  <div class="ornament"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
</div>

<section class="customize-container">
  <div class="panel">
    <h2>
      <i class="fa-solid fa-seedling" style="color:var(--green);"></i>
      Select Flowers
    </h2>

    <div class="flower-options" id="flower-options">
      <div style="text-align:center;padding:24px;color:var(--muted);">
        <i class="fa-solid fa-spinner fa-spin"></i> Loading flowers...
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>
      <i class="fa-solid fa-heart" style="color:var(--primary);"></i>
      Your Bouquet
    </h2>

    <div class="bouquet-list" id="bouquet-list">
      <div class="bouquet-empty" id="bouquet-empty">
        <i class="fa-regular fa-circle-dot"></i>
        <p>No flowers yet — start selecting from the left panel.</p>
      </div>
    </div>

    <div class="bouquet-total">
      <span>Total</span>
      <strong id="bouquet-total">$0.00</strong>
    </div>

    <button class="btn-order" id="add-bouquet-btn" style="width:100%;margin-top:18px;" disabled onclick="addBouquetToCart()">
      <i class="fa-solid fa-basket-shopping"></i> Add Bouquet to Cart
    </button>
  </div>
</section>

<footer>
  <a href="index.html" class="logo footer-logo-link">
    <img src="images/bloomify_logo.png" alt="Bloomify logo">
  </a>
  <p>© 2026 Bloomify. All rights reserved.</p>
</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>

<script>
const bouquet = new Map();
const flowersById = new Map();

async function loadFlowers() {
  const options = document.getElementById('flower-options');

  try {
    const { data } = await apiFetch('/products.php?action=all');

    const flowers = (data.products || []).filter(product => product.in_stock);

    flowersById.clear();

    flowers.forEach(product => {
      flowersById.set(product.id, product);
    });

    if (!data.success || !flowers.length) {
      options.innerHTML = `
        <p style="color:var(--muted);text-align:center;grid-column:1/-1;">
          No flowers available.
        </p>
      `;
      return;
    }

    options.innerHTML = flowers.map(product => `
      <button class="flower-opt-btn" onclick="addFlowerById(${product.id})">
        <span class="f-emoji">${escapeHtml(product.emoji)}</span>
        <span class="f-info">
          <span class="f-name">${escapeHtml(product.name)}</span>
          <span class="f-price">${money(product.price)} • ${product.stock} left</span>
        </span>
      </button>
    `).join('');
  } catch (error) {
    console.error(error);

    options.innerHTML = `
      <p style="color:var(--primary);text-align:center;grid-column:1/-1;">
        Failed to load flowers. Check database connection.
      </p>
    `;
  }
}

function addFlowerById(id) {
  const product = flowersById.get(id);

  if (!product) {
    return;
  }

  addFlower(product);
}

function addFlower(product) {
  const current = bouquet.get(product.id) || { ...product, quantity: 0 };

  if (current.quantity >= product.stock) {
    showToast(`${product.name} has only ${product.stock} in stock.`, 'error');
    return;
  }

  current.quantity += 1;
  bouquet.set(product.id, current);

  renderBouquet();
}

function changeBouquetQty(id, amount) {
  const item = bouquet.get(id);

  if (!item) {
    return;
  }

  item.quantity += amount;

  if (item.quantity <= 0) {
    bouquet.delete(id);
  } else {
    bouquet.set(id, item);
  }

  renderBouquet();
}

function renderBouquet() {
  const list = document.getElementById('bouquet-list');
  const totalEl = document.getElementById('bouquet-total');
  const button = document.getElementById('add-bouquet-btn');

  const items = Array.from(bouquet.values());

  if (!items.length) {
    list.innerHTML = `
      <div class="bouquet-empty" id="bouquet-empty">
        <i class="fa-regular fa-circle-dot"></i>
        <p>No flowers yet — start selecting from the left panel.</p>
      </div>
    `;

    totalEl.textContent = '$0.00';
    button.disabled = true;

    return;
  }

  let total = 0;

  list.innerHTML = items.map(item => {
    total += item.price * item.quantity;

    return `
      <div class="bouquet-item">
        <div class="bouquet-item-main">
          <span>${escapeHtml(item.emoji)}</span>
          <div>
            <strong>${escapeHtml(item.name)}</strong><br>
            <small>${money(item.price)} each</small>
          </div>
        </div>

        <div class="qty-actions">
          <button onclick="changeBouquetQty(${item.id}, -1)">−</button>
          <strong>${item.quantity}</strong>
          <button onclick="changeBouquetQty(${item.id}, 1)">+</button>
        </div>
      </div>
    `;
  }).join('');

  totalEl.textContent = money(total);
  button.disabled = false;
}

async function addBouquetToCart() {
  const session = await checkSession();

  if (!session.logged_in) {
    showToast('Please login before adding a bouquet.', 'error');
    setTimeout(() => window.location.href = 'login.html', 700);
    return;
  }

  const button = document.getElementById('add-bouquet-btn');

  button.disabled = true;
  button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Adding...';

  try {
    for (const item of bouquet.values()) {
      const ok = await addToCart(null, item.id, item.quantity);

      if (!ok) {
        throw new Error('Could not add all bouquet items.');
      }
    }

    showToast('Bouquet added to cart.');

    setTimeout(() => window.location.href = 'cart.html', 700);
  } catch (error) {
    console.error(error);

    showToast(error.message || 'Failed to add bouquet.', 'error');

    button.disabled = false;
    button.innerHTML = '<i class="fa-solid fa-basket-shopping"></i> Add Bouquet to Cart';
  }
}

document.addEventListener('DOMContentLoaded', loadFlowers);
</script>
</body>
</html>
