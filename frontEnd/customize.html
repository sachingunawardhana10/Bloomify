   <nav>

      <li><a href="catalog.html">Flowers</a></li>
      <li><a href="customize.html">Customize</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li id="nav-admin-link" style="display:none;"><a href="admin.html">Admin</a></li>
      <li id="nav-login-link"><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <div class="nav-right">
    <div class="nav-user" id="nav-user-info">
      <span>
        <i class="fa-solid fa-circle" style="color:#9fe39f;font-size:8px;"></i>
        <span id="nav-user-name"></span>
      </span>

    <a href="cart.html" class="nav-cart-btn">
      <i class="fa-solid fa-basket-shopping"></i>
      <span id="cart-count" style="display:none;">0</span>
    </a>
  </div>
</header>

<div class="page-header">
  <h1>Build Your Bouquet</h1>
  <p>Live flower and stock data with real images</p>
  <div class="ornament"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
</div>

<section class="customize-container">
  <div class="panel">
    <h2>
      <i class="fa-solid fa-seedling" style="color:var(--green);"></i>
      Select Flowers
    </h2>

    <div class="flower-options" id="flower-options">
      <div style="text-align:center;padding:24px;color:var(--muted);">
        <i class="fa-solid fa-spinner fa-spin"></i> Loading flowers...
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>
      <i class="fa-solid fa-heart" style="color:var(--primary);"></i>
      Your Bouquet
    </h2>

    <div class="bouquet-list" id="bouquet-list">
      <div class="bouquet-empty">
        <i class="fa-regular fa-circle-dot"></i>
        <p>No flowers yet — start selecting from the left panel.</p>
      </div>
    </div>

    <div class="bouquet-total">
      <span>Total</span>
      <strong id="bouquet-total">$0.00</strong>
    </div>

    <button class="btn-order" id="add-bouquet-btn" style="width:100%;margin-top:18px;" disabled onclick="addBouquetToCart()">
      <i class="fa-solid fa-basket-shopping"></i> Add Bouquet to Cart
    </button>
  </div>
</section>

<footer>
  <a href="index.html" class="logo footer-logo-link">
    <img src="images/bloomify_logo.png" alt="Bloomify logo">
  </a>
  <p>© 2026 Bloomify. All rights reserved.</p>
</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>

<script>
// bouquet is now keyed by VARIETY id, not flower id — two colors of the
// same flower are two different cart lines with their own price/stock.
const bouquet = new Map();
const flowersById = new Map();

let lastCustomizeSignature = '';
let customizeBusy = false;
let expandedFlowerId = null; // which flower card is currently expanded

function flowerImage(product) {
  return product.image && product.image.trim() !== ''
    ? product.image
    : 'images/flowers/default.jpg';
}

function toggleFlowerExpand(flowerId) {
  expandedFlowerId = expandedFlowerId === flowerId ? null : flowerId;
  renderFlowerOptions(Array.from(flowersById.values()));
}

function renderFlowerOptions(products) {
  const options = document.getElementById('flower-options');
  const availableFlowers = products.filter(product => product.in_stock);

  if (!availableFlowers.length) {
    options.innerHTML = `
      <p style="color:var(--muted);text-align:center;grid-column:1/-1;">
        No flowers available right now.
      </p>
    `;
    return;
  }

  options.innerHTML = availableFlowers.map(product => {
    const isOpen = product.id === expandedFlowerId;
    const cheapest = Math.min(...product.varieties.map(v => v.price));

    return `
      <div class="flower-opt-card ${isOpen ? 'open' : ''}">
        <button class="flower-opt-btn" type="button" onclick="toggleFlowerExpand(${product.id})">
          <img 
            class="f-thumb" 
            src="${escapeHtml(flowerImage(product))}" 
            alt="${escapeHtml(product.name)}"
            onerror="this.src='images/flowers/default.jpg';"
          >

          <span class="f-info">
            <span class="f-name">${escapeHtml(product.name)}</span>
            <span class="f-price">from ${money(cheapest)} • ${product.stock} left</span>
          </span>

          <i class="fa-solid fa-chevron-down f-chevron"></i>
        </button>

        <div class="variety-panel">
          ${product.varieties.map(v => `
            <button 
              type="button" 
              class="variety-row ${v.stock <= 0 ? 'disabled' : ''}" 
              onclick="addVariety(${product.id}, ${v.id})"
              ${v.stock <= 0 ? 'disabled' : ''}
            >
              <span class="variety-swatch" style="background:${escapeHtml(v.color || '#ccc')}"></span>
              <span class="variety-row-name">${escapeHtml(v.name)}</span>
              <span class="variety-row-stock">${v.stock} left</span>
              <span class="variety-row-price">${money(v.price)}</span>
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function syncBouquetWithLatestProducts(products) {
  const latestVarietyMap = new Map();

  products.forEach(product => {
    product.varieties.forEach(v => {
      latestVarietyMap.set(v.id, {
        ...v,
        flowerId: product.id,
        flowerName: product.name,
        image: product.image
      });
    });
  });

  let changed = false;

  for (const [varietyId, item] of bouquet.entries()) {
    const latest = latestVarietyMap.get(varietyId);

    if (!latest || latest.stock <= 0) {
      bouquet.delete(varietyId);
      changed = true;
      continue;
    }

    if (item.quantity > latest.stock) {
      item.quantity = latest.stock;
      changed = true;
    }

    item.price = Number(latest.price);
    item.stock = Number(latest.stock);
    item.flowerName = latest.flowerName;
    item.varietyName = latest.name;
    item.color = latest.color;
    item.image = latest.image;

    bouquet.set(varietyId, item);
  }

  if (changed) {
    showToast('Bouquet updated because stock changed.', 'info');
  }
}

async function loadFlowersRealtime(firstLoad = false) {
  if (customizeBusy) return;

  customizeBusy = true;

  const options = document.getElementById('flower-options');

  try {
    const { data } = await apiFetch('/products.php?action=all');

    if (!data.success) {
      if (firstLoad) {
        options.innerHTML = `
          <p style="color:var(--primary);text-align:center;grid-column:1/-1;">
            Could not load flowers. Check database connection.
          </p>
        `;
      }

      return;
    }

    const products = data.products || [];
    const newSignature = JSON.stringify(products);

    if (newSignature !== lastCustomizeSignature) {
      lastCustomizeSignature = newSignature;

      flowersById.clear();

      products.forEach(product => {
        flowersById.set(product.id, product);
      });

      syncBouquetWithLatestProducts(products);
      renderFlowerOptions(products);
      renderBouquet();
    }
  } catch (error) {
    console.error(error);

    if (firstLoad) {
      options.innerHTML = `
        <p style="color:var(--primary);text-align:center;grid-column:1/-1;">
          Failed to load flowers. Check database connection.
        </p>
      `;
    }
  } finally {
    customizeBusy = false;
  }
}

function addVariety(flowerId, varietyId) {
  const product = flowersById.get(flowerId);

  if (!product) {
    showToast('This flower is not available anymore.', 'error');
    return;
  }

  const variety = product.varieties.find(v => v.id === varietyId);

  if (!variety) {
    showToast('This variety is not available anymore.', 'error');
    return;
  }

  if (variety.stock <= 0) {
    showToast(`${product.name} (${variety.name}) is out of stock.`, 'error');
    return;
  }

  const current = bouquet.get(varietyId) || {
    varietyId,
    flowerId,
    flowerName: product.name,
    varietyName: variety.name,
    color: variety.color,
    image: product.image,
    price: Number(variety.price),
    stock: Number(variety.stock),
    quantity: 0
  };

  if (current.quantity >= variety.stock) {
    showToast(`${product.name} (${variety.name}) has only ${variety.stock} in stock.`, 'error');
    return;
  }

  current.quantity += 1;
  bouquet.set(varietyId, current);

  renderBouquet();
}

function changeBouquetQty(varietyId, amount) {
  const item = bouquet.get(varietyId);

  if (!item) {
    return;
  }

  item.quantity += amount;

  if (item.quantity <= 0) {
    bouquet.delete(varietyId);
  } else if (item.quantity > item.stock) {
    item.quantity = item.stock;
    showToast(`${item.flowerName} (${item.varietyName}) has only ${item.stock} in stock.`, 'error');
  } else {
    bouquet.set(varietyId, item);
  }

  renderBouquet();
}

function renderBouquet() {
  const list = document.getElementById('bouquet-list');
  const totalEl = document.getElementById('bouquet-total');
  const button = document.getElementById('add-bouquet-btn');

  const items = Array.from(bouquet.values());

  if (!items.length) {
    list.innerHTML = `
      <div class="bouquet-empty">
        <i class="fa-regular fa-circle-dot"></i>
        <p>No flowers yet — start selecting from the left panel.</p>
      </div>
    `;

    totalEl.textContent = '$0.00';
    button.disabled = true;
    return;
  }

  let total = 0;

  list.innerHTML = items.map(item => {
    total += Number(item.price) * Number(item.quantity);

    return `
      <div class="bouquet-item">
        <div class="bouquet-item-main">
          <img 
            class="bouquet-thumb" 
            src="${escapeHtml(item.image || 'images/flowers/default.jpg')}" 
            alt="${escapeHtml(item.flowerName)}"
            onerror="this.src='images/flowers/default.jpg';"
          >

          <div>
            <strong>${escapeHtml(item.flowerName)} — ${escapeHtml(item.varietyName)}</strong><br>
            <small>${money(item.price)} each • ${item.stock} left</small>
          </div>
        </div>

        <div class="qty-actions">
          <button onclick="changeBouquetQty(${item.varietyId}, -1)">−</button>
          <strong>${item.quantity}</strong>
          <button onclick="changeBouquetQty(${item.varietyId}, 1)">+</button>
        </div>
      </div>
    `;
  }).join('');

  totalEl.textContent = money(total);
  button.disabled = false;
}

async function addBouquetToCart() {
  const session = await checkSession();

  if (!session.logged_in) {
    showToast('Please login before adding a bouquet.', 'error');
    setTimeout(() => window.location.href = 'login.html', 700);
    return;
  }

  const button = document.getElementById('add-bouquet-btn');

  button.disabled = true;
  button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Adding...';

  try {
    for (const item of bouquet.values()) {
      const ok = await addToCart(null, item.flowerId, item.varietyId, item.quantity);

      if (!ok) {
        throw new Error('Could not add all bouquet items.');
      }
    }

    showToast('Bouquet added to cart.');
    bouquet.clear();
    renderBouquet();

    setTimeout(() => window.location.href = 'cart.html', 700);
  } catch (error) {
    console.error(error);
    showToast(error.message || 'Failed to add bouquet.', 'error');

    button.disabled = false;
    button.innerHTML = '<i class="fa-solid fa-basket-shopping"></i> Add Bouquet to Cart';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadFlowersRealtime(true);

  setInterval(() => {
    if (!document.hidden) {
      loadFlowersRealtime(false);
    }
  }, 3000);
});
</script>
</body>
</html>
