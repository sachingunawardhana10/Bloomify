<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower Catalog - Bloomify</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="brand-logo" aria-label="Bloomify home">
    <img src="images/bloomify_logo.png" alt="Bloomify logo">
  </a>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="catalog.html" class="active">Flowers</a></li>
      <li><a href="customize.html">Customize</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li id="nav-admin-link" style="display:none;"><a href="admin.html">Admin</a></li>
      <li id="nav-login-link"><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <div class="nav-right">
    <div class="nav-user" id="nav-user-info">
      <span>
        <i class="fa-solid fa-circle" style="color:#9fe39f;font-size:8px;"></i>
        <span id="nav-user-name"></span>
      </span>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>

    <a href="cart.html" class="nav-cart-btn">
      <i class="fa-solid fa-basket-shopping"></i>
      <span id="cart-count" style="display:none;">0</span>
    </a>
  </div>
</header>

<div class="page-header">
  <h1>Flower Catalog</h1>
  <p>Live flower list with real images from your MySQL database</p>
  <div class="ornament"><i class="fa-solid fa-leaf"></i></div>
</div>

<div class="category-tabs">
  <button class="active" data-category="All">All</button>
  <button data-category="Popular">Popular</button>
  <button data-category="New">New Arrivals</button>
  <button data-category="Emotion">Emotions</button>
  <button data-category="Occasion">Occasions</button>
</div>

<div id="subCategoryCards" class="sub-category-cards"></div>

<section class="catalog" id="catalog-loading">
  <div class="skel-card"></div>
  <div class="skel-card"></div>
  <div class="skel-card"></div>
</section>

<section class="catalog" id="catalog-grid" style="display:none;"></section>

<footer>
  <a href="index.html" class="logo footer-logo-link">
    <img src="images/bloomify_logo.png" alt="Bloomify logo">
  </a>
  <p>
    <a href="about.html">About Us</a> &nbsp;|&nbsp;
    <a href="contact.html">Contact Us</a>
  </p>
  <p>© 2026 Bloomify. All rights reserved.</p>
</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>

<script>
let lastCatalogSignature = '';
let catalogBusy = false;
let lastCatalogProducts = [];
let expandedFlowerId = null;
let activeCategory = 'All';
let activeSubcategory = '';

const subCategories = {
  Emotion: [
    'Love',
    'Happiness',
    'Friendship',
    'Gratitude',
    'Sympathy',
    'Apology'
  ],
  Occasion: [
    'Birthday',
    'Anniversary',
    'Wedding',
    'Graduation',
    "Mother's Day",
    "Valentine's Day"
  ]
};

function renderSubCategories(category) {
  const container = document.getElementById('subCategoryCards');

  if (!subCategories[category]) {
    container.innerHTML = '';
    activeSubcategory = '';
    return;
  }

  container.innerHTML = subCategories[category]
    .map(item => `
      <button class="sub-card" type="button" data-subcategory="${escapeHtml(item.trim())}">
        <h3>${escapeHtml(item.trim())}</h3>
      </button>
    `)
    .join('');

  container.querySelectorAll('.sub-card').forEach(card => {
    card.addEventListener('click', () => {
      container.querySelectorAll('.sub-card').forEach(item => item.classList.remove('active'));
      card.classList.add('active');
      activeSubcategory = card.getAttribute('data-subcategory') || '';
      expandedFlowerId = null;
      lastCatalogSignature = '';
      gridWithLoadingState();
    });
  });
}

function flowerImage(product) {
  return product.image && product.image.trim() !== ''
    ? product.image
    : 'images/flowers/default.jpg';
}

function toggleCatalogExpand(flowerId) {
  expandedFlowerId = expandedFlowerId === flowerId ? null : flowerId;
  renderCatalog(lastCatalogProducts);
}

function renderCatalog(products) {
  const grid = document.getElementById('catalog-grid');

  if (!products.length) {
    grid.innerHTML = `
      <div class="empty-cart" style="grid-column:1/-1;">
        <div class="empty-icon">🌸</div>
        <h3>No flowers available</h3>
        <p>Add flowers from the admin dashboard.</p>
      </div>
    `;
    return;
  }

  grid.innerHTML = products.map(product => {
    const varieties = product.varieties || [];
    const isOpen = product.id === expandedFlowerId;
    const cheapest = varieties.length
      ? Math.min(...varieties.map(v => v.price))
      : Number(product.price);

    return `
      <article class="flower-card ${!product.in_stock ? 'out-of-stock' : ''} ${isOpen ? 'open' : ''}">
        <div class="flower-card-img real-flower-img">
          <img 
            src="${escapeHtml(flowerImage(product))}" 
            alt="${escapeHtml(product.name)}"
            onerror="this.src='images/flowers/default.jpg';"
          >

          ${product.tag ? `<span class="flower-tag">${escapeHtml(product.tag)}</span>` : ''}
        </div>

        <div class="flower-card-body">
          <h3>${escapeHtml(product.name)}</h3>
          <p class="meaning">${escapeHtml(product.meaning || 'Beautiful Sentiment')}</p>
          <p class="meaning">
            <strong>Best for:</strong> ${escapeHtml(product.subcategory || product.tag || 'Special Occasions')}
          </p>

          ${
            product.in_stock
              ? `<span class="stock-badge">${product.stock} in stock</span>`
              : '<span class="stock-badge">Out of Stock</span>'
          }
        </div>

        <button 
          type="button" 
          class="btn-toggle-varieties" 
          onclick="toggleCatalogExpand(${product.id})"
          ${!product.in_stock ? 'disabled' : ''}
        >
          from ${money(cheapest)} <i class="fa-solid fa-chevron-down"></i>
        </button>

        <div class="variety-panel">
          ${varieties.map(v => `
            <div class="variety-row ${v.stock <= 0 ? 'disabled' : ''}">
              <span class="variety-swatch" style="background:${escapeHtml(v.color || '#ccc')}"></span>
              <span class="variety-row-name">${escapeHtml(v.name)}</span>
              <span class="variety-row-stock">${v.stock} left</span>
              <span class="variety-row-price">${money(v.price)}</span>
              <button 
                class="btn-add-sm" 
                onclick="addToCart(this, ${product.id}, ${v.id}, 1)" 
                ${v.stock <= 0 ? 'disabled' : ''}
              >
                <i class="fa-solid fa-plus"></i>
              </button>
            </div>
          `).join('')}
        </div>
      </article>
    `;
  }).join('');
}

async function loadProductsRealtime(firstLoad = false) {
  if (catalogBusy) return;

  catalogBusy = true;

  const loading = document.getElementById('catalog-loading');
  const grid = document.getElementById('catalog-grid');

  try {
    const params = new URLSearchParams({
      action: 'all',
      category: activeCategory
    });

    if (activeSubcategory) {
      params.set('subcategory', activeSubcategory);
    }

    const { data } = await apiFetch(`/products.php?${params.toString()}`);

    if (firstLoad) {
      loading.style.display = 'none';
      grid.style.display = 'grid';
    }

    if (!data.success) {
      if (firstLoad) {
        grid.innerHTML = `
          <div class="empty-cart" style="grid-column:1/-1;">
            <div class="empty-icon">⚠️</div>
            <h3>Could not load flowers</h3>
            <p>${escapeHtml(data.message || 'Check database connection.')}</p>
          </div>
        `;
      }

      return;
    }

    const products = data.products || [];
    const newSignature = JSON.stringify(products);

    if (newSignature !== lastCatalogSignature) {
      lastCatalogSignature = newSignature;
      lastCatalogProducts = products;
      renderCatalog(products);
    }
  } catch (error) {
    console.error(error);

    if (firstLoad) {
      loading.style.display = 'none';
      grid.style.display = 'grid';

      grid.innerHTML = `
        <div class="empty-cart" style="grid-column:1/-1;">
          <div class="empty-icon">⚠️</div>
          <h3>Could not load flowers</h3>
          <p>Check API path, api/db.php password and database import.</p>
        </div>
      `;
    }
  } finally {
    catalogBusy = false;
  }
}

function gridWithLoadingState() {
  const grid = document.getElementById('catalog-grid');
  grid.style.opacity = '0.5';

  loadProductsRealtime(false).then(() => {
    grid.style.opacity = '1';
  });
}

document.addEventListener('DOMContentLoaded', () => {
  loadProductsRealtime(true);

  const tabs = document.querySelectorAll('.category-tabs button');
  tabs.forEach(tab => {
    tab.addEventListener('click', (e) => {
      tabs.forEach(t => t.classList.remove('active'));
      e.currentTarget.classList.add('active');

      activeCategory = e.currentTarget.getAttribute('data-category');
      activeSubcategory = '';
      expandedFlowerId = null;
      renderSubCategories(activeCategory);

      lastCatalogSignature = '';
      gridWithLoadingState();
    });
  });

  setInterval(() => {
    if (!document.hidden) {
      loadProductsRealtime(false);
    }
  }, 3000);
});
</script>

</body>
</html>
