<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Bloomify</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
  <a href="index.html" class="brand-logo" aria-label="Bloomify home">
    <img src="images/bloomify_logo.png" alt="Bloomify logo">
  </a>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="catalog.html">Flowers</a></li>
      <li><a href="customize.html">Customize</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html" class="active">Login</a></li>
    </ul>
  </nav>

  <div class="nav-right">
    <a href="cart.html" class="nav-cart-btn">
      <i class="fa-solid fa-basket-shopping"></i>
      <span id="cart-count" style="display:none;">0</span>
    </a>
  </div>
</header>

<main class="login-page">
  <section class="login-shell fade-up">
    <div class="login-art" aria-hidden="true">
      <div class="login-art-copy">
        <span>Bloomify</span>
        <h1>Fresh blooms, thoughtfully arranged.</h1>
        <p>Sign in to continue your cart, custom bouquets, and orders.</p>
      </div>
    </div>

    <section class="login-card">
      <div class="login-card-head">
        <div class="login-logo">Bloom<span>ify</span></div>
        <p class="login-sub">Welcome back. Choose how you want to continue.</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="login-tab" onclick="switchAuthTab('login')">
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
          Sign In
        </button>
        <button class="auth-tab" id="register-tab" onclick="switchAuthTab('register')">
          <i class="fa-solid fa-user-plus"></i>
          Create Account
        </button>
      </div>

      <div id="auth-msg" class="auth-message"></div>

      <form class="auth-form active" id="form-login" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <div class="input-shell">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="login-email" placeholder="admin@bloomify.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-shell">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="login-password" placeholder="admin123" autocomplete="current-password" required>
          </div>
        </div>

        <button class="btn-primary login-submit" id="login-btn" type="submit">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
        </button>

        <p class="login-footer">
          Demo admin: <strong>admin@bloomify.com</strong> / <strong>admin123</strong>
        </p>
      </form>

      <form class="auth-form" id="form-register" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <div class="input-shell">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="reg-name" placeholder="Your name" autocomplete="name" required>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <div class="input-shell">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="reg-email" placeholder="hello@example.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <div class="input-shell">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="reg-password" placeholder="Minimum 6 characters" autocomplete="new-password" required minlength="6">
          </div>
        </div>

        <button class="btn-primary login-submit" id="reg-btn" type="submit">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </form>
    </section>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/app.js"></script>

<script>
function setMessage(message, type = 'success') {
  const box = document.getElementById('auth-msg');

  box.textContent = message;
  box.className = `auth-message ${type}`;
}

function switchAuthTab(tab) {
  document.getElementById('form-login').classList.toggle('active', tab === 'login');
  document.getElementById('form-register').classList.toggle('active', tab === 'register');

  document.getElementById('login-tab').classList.toggle('active', tab === 'login');
  document.getElementById('register-tab').classList.toggle('active', tab === 'register');

  document.getElementById('auth-msg').className = 'auth-message';
}

async function redirectIfLoggedIn() {
  const session = await checkSession();

  if (session.logged_in) {
    window.location.href = session.user.role === 'admin' ? 'admin.html' : 'index.html';
  }
}

async function handleLogin(event) {
  event.preventDefault();

  const button = document.getElementById('login-btn');

  button.disabled = true;
  button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

  try {
    const { data } = await apiFetch('/auth.php?action=login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('login-email').value.trim(),
        password: document.getElementById('login-password').value
      })
    });

    if (data.success) {
      setMessage('Login successful. Redirecting...', 'success');
      window.location.href = data.user.role === 'admin' ? 'admin.html' : 'index.html';
    } else {
      setMessage(data.message || 'Login failed.', 'error');
    }
  } catch (error) {
    console.error(error);
    setMessage(error.message || 'Network error.', 'error');
  } finally {
    button.disabled = false;
    button.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In';
  }
}

async function handleRegister(event) {
  event.preventDefault();

  const button = document.getElementById('reg-btn');

  button.disabled = true;
  button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating...';

  try {
    const { data } = await apiFetch('/auth.php?action=register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('reg-name').value.trim(),
        email: document.getElementById('reg-email').value.trim(),
        password: document.getElementById('reg-password').value
      })
    });

    if (data.success) {
      setMessage(data.message, 'success');
      document.getElementById('form-register').reset();
      switchAuthTab('login');
    } else {
      setMessage(data.message || 'Registration failed.', 'error');
    }
  } catch (error) {
    console.error(error);
    setMessage(error.message || 'Network error.', 'error');
  } finally {
    button.disabled = false;
    button.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
  }
}

document.addEventListener('DOMContentLoaded', redirectIfLoggedIn);
</script>
</body>
</html>
