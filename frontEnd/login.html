<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Bloomify</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-tabs{display:flex;margin-bottom:28px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);}
    .auth-tab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:500;cursor:pointer;background:var(--bg);color:var(--text-muted);border:none;transition:all .2s;}
    .auth-tab.active{background:var(--primary);color:#fff;}
    .auth-form{display:none;} .auth-form.active{display:block;}
  </style>
</head>
<body>
<header class="navbar">
  <a href="index.html" class="logo">Bloom<span>ify</span></a>
  <nav><ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="catalog.html">Flowers</a></li>
    <li><a href="customize.html">Customize</a></li>
    <li><a href="login.html" class="active">Login</a></li>
  </ul></nav>
  <div class="nav-right">
    <a href="cart.html" class="nav-cart-btn"><i class="fa-solid fa-basket-shopping"></i><span id="cart-count" style="display:none;">0</span></a>
  </div>
</header>

<main class="login-page">
  <div class="login-card fade-up">
    <div class="login-logo">Bloom<span>ify</span></div>
    <p class="login-sub">Welcome — sign in or create an account</p>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" onclick="switchTab('register')">Create Account</button>
    </div>
    <div id="auth-msg" style="display:none;padding:12px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;margin-bottom:20px;"></div>

    <!-- LOGIN -->
    <div class="auth-form active" id="form-login">
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" placeholder="hello@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-primary" style="width:100%;justify-content:center;margin-top:8px;" id="login-btn" onclick="handleLogin()">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
      </button>
      <p class="login-footer">Don't have an account? <a href="#" onclick="switchTab('register')">Create one</a></p>
    </div>

    <!-- REGISTER -->
    <div class="auth-form" id="form-register">
      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" placeholder="Your name" autocomplete="name">
      </div>
      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <input type="email" id="reg-email" placeholder="hello@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="reg-password">Password <span style="color:var(--text-muted);font-size:12px;">(min 6 chars)</span></label>
        <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn-primary" style="width:100%;justify-content:center;margin-top:8px;" id="reg-btn" onclick="handleRegister()">
        <i class="fa-solid fa-user-plus"></i> Create Account
      </button>
      <p class="login-footer">Already have an account? <a href="#" onclick="switchTab('login')">Sign in</a></p>
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Bloomify</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-tabs{display:flex;margin-bottom:28px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);}
    .auth-tab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:500;cursor:pointer;background:var(--bg);color:var(--text-muted);border:none;transition:all .2s;}
    .auth-tab.active{background:var(--primary);color:#fff;}
    .auth-form{display:none;} .auth-form.active{display:block;}
  </style>
</head>
<body>

<script>


/* ================= TAB SWITCH ================= */
function switchTab(tab) {

  document.getElementById("form-login").classList.remove("active");
  document.getElementById("form-register").classList.remove("active");

  document.querySelectorAll(".auth-tab").forEach(btn => {
    btn.classList.remove("active");
  });

  if (tab === "login") {
    document.getElementById("form-login").classList.add("active");
    document.querySelectorAll(".auth-tab")[0].classList.add("active");
  } else {
    document.getElementById("form-register").classList.add("active");
    document.querySelectorAll(".auth-tab")[1].classList.add("active");
  }
}



/* ================= LOGIN ================= */
async function handleLogin() {

  const email = document.getElementById("login-email").value;
  const password = document.getElementById("login-password").value;

  const res = await fetch(`${API}/auth.php?action=login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "include",
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (data.success) {
    if (data.user.role === "admin") {
      window.location.href = "admin.html";
    } else {
      window.location.href = "index.html";
    }
  } else {
    alert(data.message);
  }
}

/* ================= REGISTER ================= */
async function handleRegister() {
  const name = document.getElementById("reg-name").value;
  const email = document.getElementById("reg-email").value;
  const password = document.getElementById("reg-password").value;

  try {
    const res = await fetch(`${API}/auth.php?action=register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password })
    });

    const data = await res.json();

    if (data.success) {
      alert("Account created");
      switchTab("login");
    } else {
      alert(data.message || "Register failed");
    }

  } catch (err) {
    console.error(err);
    alert("Network error");
  }
}
</script>

</body>
</html>
